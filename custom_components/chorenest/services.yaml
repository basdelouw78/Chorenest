mark_done:
  name: Toggle task done
  description: Toggles a task as done/not done.
  fields:
    key:
      name: Task key
      description: Internal task key (from sensor attributes).
      required: false
      example: "rot__2025-01-06__Emma__Load dishwasher"
      selector:
        text:
    child:
      name: Child
      description: Child's name (alternative to key).
      required: false
      selector:
        text:
    task:
      name: Task
      description: Task name.
      required: false
      selector:
        text:

reset_week:
  name: Reset week
  description: Marks all completed weekly tasks as not done (monthly tasks are kept).

reset_all:
  name: Reset all
  description: Marks ALL completed tasks as not done.

set_presence:
  name: Set presence
  description: Manually override presence for a child. Use present=null to reset.
  fields:
    child:
      name: Child
      description: Child's name.
      required: true
      selector:
        text:
    present:
      name: Present
      description: "true = present, false = not present, null/omit = automatic (reset override)"
      required: false
      selector:
        boolean:

clear_presence_override:
  name: Clear presence override
  description: Resets the manual presence override — the configured pattern is used again.
  fields:
    child:
      name: Child
      required: true
      selector:
        text:

move_task:
  name: Move a task to another day
  description: >-
    A child moves one of her own tasks to another day of the current week
    (today or later, a day she is home and has time). From Monday the normal
    schedule applies again.
  fields:
    child:
      name: Child
      required: true
      selector:
        text:
    task:
      name: Task
      required: true
      selector:
        text:
    date:
      name: Date
      description: Current date of the task.
      required: true
      selector:
        date:
    to_date:
      name: New date
      required: true
      selector:
        date:
swap_days:
  name: Swap two days of one child
  description: >-
    A child swaps the open tasks of two of her days this week, e.g. a free day
    with a day that has tasks. Tasks that are on both days stay put.
  fields:
    child:
      name: Child
      required: true
      selector:
        text:
    date:
      name: Date
      required: true
      selector:
        date:
    other_date:
      name: Other date
      required: true
      selector:
        date:
swap_task:
  name: Swap a task
  description: >-
    Two children trade tasks for the current week only (from Monday the normal
    schedule applies again). Give other_task/other_date for an exchange, e.g.
    "I do your Thursday task if you do my Wednesday one"; leave them out to
    simply hand the task over to the other child. Daily rotating and weekly
    tasks can be swapped.
  fields:
    child:
      name: Child
      description: Child that currently has the task.
      required: true
      selector:
        text:
    task:
      name: Task
      description: Name of the task to give away.
      required: true
      selector:
        text:
    date:
      name: Date
      description: Date of that task (today or later this week).
      required: true
      selector:
        date:
    with_child:
      name: With child
      description: Child that takes the task over.
      required: true
      selector:
        text:
    other_task:
      name: Task in return
      description: Optional task of the other child that the first child does in return.
      required: false
      selector:
        text:
    other_date:
      name: Date of the task in return
      description: Date of the task in return (required with other_task).
      required: false
      selector:
        date:

undo_swap:
  name: Undo a swap
  description: Reverts a swap made with swap_task.
  fields:
    swap_id:
      name: Swap id
      description: The id from the "swaps" attribute of sensor.chorenest_week.
      required: true
      selector:
        text:
